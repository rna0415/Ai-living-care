name: check

# PR 에서 도는 진짜 관문. pre-commit 훅은 설치 안 한 사람에게는 없는 것과 같고
# SKIP_ANCHOR 로 넘길 수도 있다 — 그래서 병합 전에 여기서 한 번 더 본다.

on:
  pull_request:
  push:
    # master 는 협업자가 직접 푸시하는 통합 브랜치다 —
    # PR 을 안 거치므로 여기서 안 돌면 검사 없이 흘러간다.
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 앵커 — CLAUDE.md 가 자기 디렉터리를 가리키는가
        run: python3 anchor.py --strict   # PR 에서는 알림도 통과시키지 않는다

      - name: 구조 — SOT.md 규범
        run: python3 sot_audit.py

      - name: 구문
        run: python3 -m compileall -q $(git ls-files '*.py')

      - name: Manager graph-inference 회귀
        run: python3 -m unittest manager_ai_agent.manager_ai_core.test_graph_inference

      - name: 셸 구문
        run: for s in $(git ls-files '*.sh'); do bash -n "$s"; done

  # 앵커는 「가리키는 것이 실재하는가」를 본다. **병합은 파일을 남긴 채 내용만 지운다** —
  # 원리적으로 안 잡힌다. `master` 가 둘 이상이 직접 푸시하는 통합 브랜치가 된 이상
  # 병합 해소가 남의 커밋을 되돌리는 것은 시간 문제다.
  #
  # ⚠ 정직하게: 이 검사는 fda5e22 「유실 복구」를 잡지 못했을 것이다. 그건 커밋된 내용이
  # 되돌아간 게 아니라 **작업 트리에만 있던 것이 두 번의 병합을 건너며 커밋되지 않은** 경우라
  # 커밋 간 diff 에 흔적이 없다 (3aae556 은 두 부모 대비 순삭제 0). 그쪽은 `make status` 의
  # 「커밋 안 된 변경」이 본다. 여기서 보는 것은 그 옆의 다른 실패다.
  #
  # **막지 않는다** — 문서를 크게 정리하는 것은 정상이고, 그것까지 막으면 정리를 벌하는 셈이다.
  loss:
    runs-on: ubuntu-latest
    # 「경고만 한다」고 선언한 잡이다. 스크립트가 삐끗해도 CI 를 붉게 만들지 않는다 —
    # 선언한 등급과 실제 종료 코드가 어긋나면 그게 다시 소음이 되고, 소음은 무시된다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 기준 커밋과 비교해야 한다

      - name: 보호 문서 순삭제 경고
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$zero" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "비교 기준 없음 (새 브랜치) — 건너뛴다"; exit 0
          fi
          PROTECTED=".githooks CLAUDE.md CONTRIBUTING.md Makefile README.md SOT.md \
                     anchor.py sot_audit.py docs/doc-map.md docs/harness.md docs/harness"
          net=$(git diff --numstat "$BASE" HEAD -- $PROTECTED \
                | awk '{a+=$1; d+=$2} END {print (d-a)+0}')
          echo "보호 문서 순삭제 ${net}줄 (기준 $(git rev-parse --short "$BASE"))"
          if [ "$net" -ge 20 ]; then
            git diff --stat "$BASE" HEAD -- $PROTECTED
            echo "::warning::보호 문서에서 순삭제 ${net}줄. 의도한 정리면 PR 에 한 줄 적고 넘어간다. 병합으로 되돌아간 것이라면 지금이 알아챌 유일한 지점이다"
          fi

  # 방향이 바뀌었는데 옛 정본이 그대로 남는 것 — 이 저장소가 세 번 겪은 유형이다
  # (`docs/CLAUDE.md` 읽는 순서 · 하네스 장치 표 7행 · `V-*`). 셋 다 그 시점에 하위
  # anchoring 은 완벽했고 감사는 초록이었다. **「추가」는 앵커가 잡지만 「방향 변경」은
  # 하위에 아무 파일도 만들지 않아 갱신할 앵커가 없다.**
  #
  # 상위가 하위를 심사하는 게 아니다. `> **정본 반영**` 은 **작업자가 자기 손으로 쓴 선언**이고
  # 여기서는 그 선언이 참인지만 본다 — A5(안전 결함 파일 ↔ `상태` 줄)와 같은 구조다.
  # **경고만 한다.** 선언 자체를 안 한 경우는 못 잡는다 — 그건 규약의 몫이다.
  reflected:
    runs-on: ubuntu-latest
    # 「경고만 한다」고 선언한 잡이다. 스크립트가 삐끗해도 CI 를 붉게 만들지 않는다 —
    # 선언한 등급과 실제 종료 코드가 어긋나면 그게 다시 소음이 되고, 소음은 무시된다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 결정의 「정본 반영」이 같은 PR 에서 실제로 바뀌었는가
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$zero" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "비교 기준 없음 — 건너뛴다"; exit 0
          fi
          git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          python3 - "$BASE" <<'PY'
          import re, sys, os
          base = sys.argv[1]
          changed = set(open("/tmp/changed.txt", encoding="utf-8").read().split())
          decisions = [f for f in changed
                       if f.startswith("docs/decisions/") and f.endswith(".md")
                       and not f.endswith("CLAUDE.md") and os.path.isfile(f)]
          if not decisions:
              print("이 PR 에 결정 파일이 없다 — 대조할 선언이 없다"); raise SystemExit(0)
          gaps = []
          for d in decisions:
              m = re.search(r"^> \*\*정본 반영\*\* (.*)$", open(d, encoding="utf-8").read(), re.M)
              if not m:
                  print(f"::warning::{d} 에 `> **정본 반영**` 줄이 없다 — 무엇이 따라가야 하는지 알 수 없다")
                  continue
              # 백틱 안에서 **경로처럼 생긴 것**만 본다 (`decisions()` 같은 심볼은 뺀다)
              targets = [t for t in re.findall(r"`([^`\n]+)`", m.group(1))
                         if ("/" in t or "." in t) and not t.endswith(")")]
              miss = [t for t in targets if t not in changed and not any(c.startswith(t.rstrip("/") + "/") for c in changed)]
              if miss:
                  gaps.append((d, miss))
              print(f"{d}: 선언 {len(targets)}개 · 미반영 {len(miss)}개")
          for d, miss in gaps:
              print(f"::warning::{d} 가 정본으로 선언한 {' · '.join(miss)} 이(가) 이 PR 에서 바뀌지 않았다. "
                    f"방향만 바꾸고 정본은 옛것 그대로면 다음 사람은 옛 정본을 따른다")
          PY

  coverage:
    runs-on: ubuntu-latest
    # 「경고만 한다」고 선언한 잡이다. 스크립트가 삐끗해도 CI 를 붉게 만들지 않는다 —
    # 선언한 등급과 실제 종료 코드가 어긋나면 그게 다시 소음이 되고, 소음은 무시된다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install "numpy>=1.26,<2" opencv-python-headless

      # 논문·제안서가 인용하는 93.6% 가 좌표·CAM_RANGE 변경으로 조용히 바뀌는 것을 본다.
      # **막지 않는다** — 순찰 로직을 실험적으로 바꾸는 것이 Phase 0 의 일이고,
      # 탐색 중에 수치가 내려가는 것은 정상이다. 논문에 수치를 인용하기 전에 여기를 본다.
      # Phase 1(견고화)에 들어가면 하한으로 되돌린다.
      # ⚠ 여기 있던 여러 줄 `python3 -c "..."` 가 **0열에서 시작해 `run: |` 블록을 끊었다.**
      # YAML 이 그 다음 줄을 최상위 키로 읽어 파일 전체가 invalid 가 됐고, 워크플로가
      # **16번 동안 한 번도 실행되지 않았다** — 「PR 에서 CI 가 잡는다」가 그동안 거짓이었다.
      # 여러 줄 스크립트를 YAML 에 넣지 않는다. 한 줄로 되는 건 `awk` 로 한다.
      - name: 순찰 커버리지 (기준선 90% · 경고)
        run: |
          cd tools/limo-patrol-viz
          ./run_coverage.sh | tee /tmp/cov.txt | tail -6
          pct=$(grep -o '= [0-9.]*%' /tmp/cov.txt | tail -1 | tr -dc '0-9.')
          if [ -z "$pct" ]; then
            echo "::warning::커버리지 수치를 못 읽었다 — run_coverage.sh 가 실패했거나 출력 형식이 바뀌었다"
            exit 0
          fi
          awk -v p="$pct" 'BEGIN { if (p+0 < 90) print "::warning::순찰 커버리지 " p "% — 기준선 90% 아래다. 의도한 변경인지 PR 에 적을 것"; else print "커버리지 " p "% — 기준선 이상" }'
